name: app_flutter
description: 跨平台 Flutter 模块。登录、首页与详情在此实现，可独立运行，也可嵌入 iOS 宿主。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  injectable_generator: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/home/

  module:
    androidX: true
    androidPackage: com.fluttermixin.app_flutter
    iosBundleIdentifier: com.fluttermixin.appFlutter
